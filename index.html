
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#000000">
  <meta name="description" content="J.A.R.V.I.S Personal AI Assistant">

  <title>J.A.R.V.I.S | Personal AI Assistant</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="https://godamahesh823-svg.github.io/jarvis-mobile-edition/style.css?v=10"
  >
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>J.A.R.V.I.S</h1>
    <p>PERSONAL AI ASSISTANT</p>
  </header>

  <!-- AI CORE -->
  <section class="core-section">
    <div class="core">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="center"></div>
    </div>

    <p class="core-text">SYSTEM READY</p>
  </section>

  <!-- SYSTEM DIAGNOSTICS -->
  <section class="status">

    <h2>SYSTEM DIAGNOSTICS</h2>

    <div class="row">
      <span>AI ENGINE</span>
      <b class="on">● OPERATIONAL</b>
    </div>

    <div class="row">
      <span>CONNECTION</span>
      <b class="on">● ONLINE</b>
    </div>

    <div class="row">
      <span>VOICE INTERFACE</span>
      <b class="on">● READY</b>
    </div>

    <div class="row">
      <span>LONG-TERM MEMORY</span>
      <b class="on">● ACTIVE</b>
    </div>

  </section>

  <!-- CHAT WINDOW -->
  <section class="chat" id="chat" aria-live="polite">
  </section>

  <!-- COMMAND AREA -->
  <section class="input-area">

    <input
      type="text"
      id="msg"
      placeholder="Enter a command for J.A.R.V.I.S..."
      autocomplete="off"
    >

    <button
      type="button"
      id="send"
    >
      EXECUTE
    </button>

    <button
      type="button"
      id="mic-btn"
      aria-label="Activate microphone"
      title="Voice command"
    >
      🎙️
    </button>

    <button
      type="button"
      id="cam-btn"
      aria-label="Open camera or select image"
      title="Image analysis"
    >
      📷
    </button>

    <button
      type="button"
      id="clear-btn"
    >
      CLEAR MEMORY
    </button>

    <!-- IMAGE INPUT -->
    <input
      type="file"
      id="img-input"
      accept="image/*"
      capture="environment"
      hidden
    >

  </section>

  <!-- JAVASCRIPT -->
  <script src="./script.js?v=5"></script>

</body>
</html>
